name: Word Hunt CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Unit tests and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run check

  production-smoke:
    name: Production API smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Vercel deployment and verify health
        env:
          BASE_URL: https://web-based-hangman-game.vercel.app
          HEALTH_URL: https://web-based-hangman-game.vercel.app/api/health
        run: |
          for attempt in $(seq 1 18); do
            if body=$(curl --silent --show-error --fail "$HEALTH_URL"); then
              echo "$body"
              node -e 'const d=JSON.parse(process.argv[1]); if (!d.ok || d.database !== "connected" || d.words !== 5000) process.exit(1)' "$body"
              exit 0
            fi
            sleep 10
          done
          echo "Production health check did not pass within 3 minutes."
          exit 1

      - name: Verify a real game can load and save its clue
        env:
          BASE_URL: https://web-based-hangman-game.vercel.app
        run: |
          set -euo pipefail
          game=$(curl --silent --show-error --fail "$BASE_URL/api/new-game?difficulty=easy&player_name=WordHunt%20CI")
          echo "$game"
          session_id=$(node -e 'const d=JSON.parse(process.argv[1]); if (!d.session_id) process.exit(1); process.stdout.write(String(d.session_id))' "$game")
          hint=$(curl --silent --show-error --fail "$BASE_URL/api/hint?session_id=$session_id")
          echo "$hint"
          node -e 'const h=JSON.parse(process.argv[1]); if (!h.hint || !h.meaning || !h.hint_source) process.exit(1)' "$hint"
          curl --silent --show-error --fail --request POST "$BASE_URL/api/end-game?session_id=$session_id" >/dev/null

      - name: Verify protected account registration and logout
        env:
          BASE_URL: https://web-based-hangman-game.vercel.app
          TEST_ACCOUNT_NAME: WordHuntCI${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(node -e 'process.stdout.write(JSON.stringify({name:process.env.TEST_ACCOUNT_NAME,password:"TestPass123"}))')
          registered=$(curl --silent --show-error --fail --request POST "$BASE_URL/api/auth?mode=register" --header "Content-Type: application/json" --data "$payload")
          token=$(node -e 'const d=JSON.parse(process.argv[1]); if (!d.auth_token || !d.verified) process.exit(1); process.stdout.write(d.auth_token)' "$registered")
          curl --silent --show-error --fail --request POST "$BASE_URL/api/auth?mode=logout" --header "Authorization: Bearer $token" >/dev/null

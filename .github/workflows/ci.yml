name: Word Hunt CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Unit tests and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run check

  production-smoke:
    name: Production API smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Vercel deployment and verify health
        env:
          HEALTH_URL: https://web-based-hangman-game.vercel.app/api/health
        run: |
          for attempt in $(seq 1 18); do
            if body=$(curl --silent --show-error --fail "$HEALTH_URL"); then
              echo "$body"
              node -e 'const d=JSON.parse(process.argv[1]); if (!d.ok || d.database !== "connected" || d.words !== 5000) process.exit(1)' "$body"
              exit 0
            fi
            sleep 10
          done
          echo "Production health check did not pass within 3 minutes."
          exit 1
